services:
  # 1. Панель управления HoneyForge (веб-интерфейс и замаскированный Control API)
  control-server:
    build:
      context: ./honey-forge-nextjs
      dockerfile: Dockerfile
    container_name: honeyforge-control-server
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - ADMIN_TOKEN=honeyforge-secret-soc-2026
    volumes:
      - honeyforge-db-data:/app/data
    networks:
      - mgmt_net

  # 2. TLS Reverse-Proxy Nginx и шлюз маскировки (MASK-1, MASK-2)
  nginx:
    image: nginx:1.24-alpine
    container_name: honeyforge-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - control-server
    networks:
      mgmt_net:
        aliases:
          - nginx
          - control-server-tls

  # 3. Низкоинтерактивный мультипортовый эмулятор баннеров
  low-interaction-decoy:
    build:
      context: ./honeypots/low-interaction
      dockerfile: Dockerfile
    container_name: honeyforge-low-decoy
    restart: unless-stopped
    ports:
      - "2121:21"
      - "2323:23"
      - "8082:80"
      - "3307:3306"
      - "6380:6379"
    networks:
      - decoy_net

  # 4. Среднеинтерактивная уязвимая HTTP-приманка (Log4j, Spring4Shell, phpMyAdmin)
  http-vulnerable-trap:
    build:
      context: ./honeypots/medium-interaction/http-trap
      dockerfile: Dockerfile
    container_name: honeyforge-http-trap
    restart: unless-stopped
    environment:
      - TRAP_PORT=8080
      - TRAP_LOG_FILE=/var/log/honeyforge/http_trap.json
    ports:
      - "8081:8080"
    volumes:
      - trap-logs:/var/log/honeyforge
    networks:
      - decoy_net

  # 5. Среднеинтерактивная ловушка Cowrie SSH/Telnet
  cowrie-ssh-trap:
    build:
      context: ./honeypots/medium-interaction/cowrie
      dockerfile: Dockerfile
    container_name: honeyforge-cowrie-trap
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    networks:
      - decoy_net

  # 6. Скрытый агент пересылки honeypot (MASK-1, MASK-4, MASK-5)
  stealth-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: honeyforge-stealth-agent
    restart: unless-stopped
    environment:
      - CONTROL_SERVER=https://nginx:443
      - AGENT_ID=node_cluster_edge_01
      - MASK_NAME=systemd-resolved
      - COWRIE_LOG_PATH=/cowrie/cowrie-git/var/log/cowrie/cowrie.json
      - HTTP_TRAP_LOG_PATH=/var/log/honeyforge/http_trap.json
      - CA_CERT_PATH=/certs/server.crt
      - AGENT_INSECURE_TLS=1
    depends_on:
      - control-server
      - nginx
      - cowrie-ssh-trap
      - http-vulnerable-trap
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie:ro
      - trap-logs:/var/log/honeyforge:ro
      - ./certs:/certs:ro
    networks:
      - decoy_net
      - mgmt_net

volumes:
  honeyforge-db-data:
  cowrie-logs:
  trap-logs:

networks:
  # Изолированный периметр приманок — только для атакующих и ловушек
  decoy_net:
    driver: bridge
  # Защищенный контур управления — только для сервера управления, TLS-прокси Nginx и канала агента
  mgmt_net:
    driver: bridge
