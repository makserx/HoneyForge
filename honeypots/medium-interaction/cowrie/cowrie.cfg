[honeypot]
hostname = svr-bastion-prod
log_path = /cowrie/cowrie-git/var/log/cowrie
download_path = /cowrie/cowrie-git/var/lib/cowrie/downloads
contents_path = /cowrie/cowrie-git/var/lib/cowrie/downloads
ttylog = true
ttylog_path = /cowrie/cowrie-git/var/lib/cowrie/tty

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.4p1 Debian-5+deb11u1

[telnet]
enabled = true
listen_endpoints = tcp:2323:interface=0.0.0.0

[output_json]
enabled = true
logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json
epoch_timestamp = false
