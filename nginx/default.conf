# ==============================================================================
# HoneyForge Nginx Reverse-Proxy with TLS (MASK-1, MASK-2)
# Terminates TLS with local self-signed certificate and masks upstream Next.js
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Stealth server signature
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS / TLS Reverse-Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates (MASK-1)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Secure TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Stealth & Camouflage Response Headers (MASK-1, MASK-2)
    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header Server "nginx/1.24.0" always;
    add_header X-Asset-Pipeline "cdn-worker-prod" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body limit for event batch uploads
    client_max_body_size 16M;

    # Dedicated SSE Stream Route (Real-Time Attack Alerts)
    location /api/control/stream {
        proxy_pass http://control-server:3000/api/control/stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';

        # Disable buffering & cache to prevent buffering SSE events
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Default Route -> Next.js Control Server
    location / {
        proxy_pass http://control-server:3000;
        proxy_http_version 1.1;

        # Forwarded Identity Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
