# ==============================================================================
# Nginx Reverse-Proxy с поддержкой TLS для HoneyForge (MASK-1, MASK-2)
# Терминирует TLS с локальным самоподписанным сертификатом и маскирует upstream Next.js
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Редирект HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Скрытая сигнатура сервера
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS / TLS Reverse-Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS-сертификаты (MASK-1)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Безопасные протоколы и шифры TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Заголовки маскировки и сокрытия ответа (MASK-1, MASK-2)
    server_tokens off;
    proxy_hide_header X-Powered-By;
    add_header Server "nginx/1.24.0" always;
    add_header X-Asset-Pipeline "cdn-worker-prod" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ограничение размера тела запроса для пакетной загрузки событий
    client_max_body_size 16M;

    # Выделенный маршрут SSE-потока (оповещения об атаках в реальном времени)
    location /api/control/stream {
        proxy_pass http://control-server:3000/api/control/stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';

        # Отключение буферизации и кэширования для предотвращения задержек SSE-событий
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Основной маршрут -> Сервер управления Next.js
    location / {
        proxy_pass http://control-server:3000;
        proxy_http_version 1.1;

        # Заголовки проброса идентификации клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Поддержка WebSocket / Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
